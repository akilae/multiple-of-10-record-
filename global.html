<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>⚡ 2x 全網二進制極速引擎</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
  background: radial-gradient(circle at top, #0f172a, #020617 65%);
  color: #38bdf8;
  font-family: "SF Mono", Monaco, Consolas, monospace;
}
.container { width: 100%; max-width: 720px; margin: auto; }
.panel {
  background: rgba(7, 13, 25, .96);
  border: 1px solid #1e293b;
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding-bottom: 12px;
  margin-bottom: 15px;
  border-bottom: 1px solid #1e293b;
}
.title { color: #f8fafc; font-weight: 800; font-size: 17px; }
.online {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border: 1px solid #10b981;
  border-radius: 999px;
  color: #34d399;
  background: rgba(16,185,129,.1);
  font-size: 12px;
  font-weight: bold;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 8px #10b981;
  animation: pulse 1.3s infinite;
}
@keyframes pulse { 50% { opacity: .35; } }
.global-label { margin-top: 10px; color: #94a3b8; font-size: 11px; letter-spacing: 2px; }
.global-number {
  margin: 10px 0;
  color: #f59e0b;
  font-size: clamp(35px, 11vw, 58px);
  font-weight: 900;
  line-height: 1.05;
  word-break: break-all;
  text-shadow: 0 0 25px rgba(245,158,11,.3);
}
.status { min-height: 20px; margin-bottom: 16px; color: #34d399; font-size: 13px; }
.auth {
  padding: 16px;
  margin-bottom: 16px;
  border: 1px solid #334155;
  border-radius: 10px;
  background: #111827;
}
input {
  width: 100%;
  padding: 12px;
  margin-bottom: 9px;
  border: 1px solid #334155;
  border-radius: 7px;
  outline: none;
  background: #020617;
  color: white;
  font-family: inherit;
  font-size: 14px;
}
input:focus { border-color: #38bdf8; }
.auth-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
button { font-family: inherit; }
.btn { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
.btn:disabled { opacity: .45; cursor: default; }
.blue { background: #2563eb; color: white; }
.green { background: #059669; color: white; }
.red { background: #dc2626; color: white; }
.purple { background: #7c3aed; color: white; }
.google { width: 100%; margin-top: 10px; background: white; color: #111827; }
.auth-error { min-height: 16px; margin-top: 10px; color: #f87171; font-size: 12px; }
.user-box {
  display: none;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 9px;
  margin-bottom: 12px;
  border-radius: 7px;
  background: #020617;
  color: #94a3b8;
  font-size: 11px;
}
.logout { border: none; background: none; color: #f87171; cursor: pointer; text-decoration: underline; }
.verify {
  display: none;
  margin-bottom: 16px;
  padding: 12px;
  background: rgba(239,68,68,.12);
  border: 1px solid #ef4444;
  border-radius: 9px;
  color: #fca5a5;
  font-size: 12px;
}
.verify button { border: none; background: none; color: #38bdf8; text-decoration: underline; cursor: pointer; }
.slider-container { display: none; margin: 16px 0; }
.slider {
  position: relative;
  height: 52px;
  overflow: hidden;
  border: 1px solid #334155;
  border-radius: 26px;
  background: #111827;
  touch-action: none;
}
.slider-fill {
  position: absolute;
  left: 0;
  top: 0;
  width: 0;
  height: 100%;
  background: rgba(16,185,129,.25);
}
.slider-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #94a3b8;
  font-size: 12px;
  font-weight: bold;
  pointer-events: none;
}
.slider-handle {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: #0284c7;
  color: white;
  font-size: 19px;
  font-weight: bold;
  cursor: grab;
  z-index: 3;
}
.slider.done { border-color: #10b981; }
.slider.done .slider-text { color: #34d399; }
.log {
  height: 230px;
  overflow-y: auto;
  margin: 16px 0;
  padding: 12px;
  border: 1px solid #172033;
  border-radius: 9px;
  background: #020617;
  text-align: left;
  color: #38bdf8;
  font-size: 12px;
  line-height: 1.6;
}
.controls { display: none; grid-template-columns: 1fr 1fr; gap: 8px; }
.full { grid-column: 1 / -1; }
.info {
  margin-top: 15px;
  padding: 8px;
  border: 1px solid #1e293b;
  border-radius: 6px;
  color: #64748b;
  background: #020617;
  font-size: 10px;
  text-align: left;
}
#afk {
  position: fixed;
  inset: 0;
  z-index: 999;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #000;
  cursor: pointer;
}
.afk-title { color: #34d399; font-size: 20px; font-weight: bold; }
.afk-number {
  margin: 22px;
  color: #f59e0b;
  font-size: clamp(40px, 12vw, 65px);
  font-weight: bold;
}
.afk-small { color: #64748b; font-size: 12px; }
</style>
</head>

<body>

<div id="afk">
  <div class="afk-title">💤 掛機模式運行中</div>
  <div id="afkNumber" class="afk-number">0</div>
  <div class="afk-small">點擊畫面停止</div>
</div>

<div class="container">
<div class="panel">

<div class="header">
  <div class="title">⚡ 2x 全網二進制極速引擎</div>
  <div class="online">
    <div class="dot"></div>
    <span id="online">在線節點: 0</span>
  </div>
</div>

<div id="userBox" class="user-box">
  <span id="userEmail"></span>
  <button id="logout" class="logout">登出</button>
</div>

<div class="global-label">GLOBAL 2X OUTPUT</div>
<div id="global" class="global-number">0</div>
<div id="status" class="status">請先登入帳號</div>

<div id="verify" class="verify">
  ⚠️ 尚未完成 Email 驗證<br><br>
  <button id="resend">重新寄驗證信</button> | <button id="reload">我已完成驗證</button>
</div>

<div id="auth" class="auth">
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="密碼">
  <div class="auth-buttons">
    <button id="login" class="btn blue">登入</button>
    <button id="signup" class="btn green">註冊</button>
  </div>
  <button id="google" class="btn google">Google 帳號登入</button>
  <div id="authError" class="auth-error"></div>
</div>

<div id="sliderContainer" class="slider-container">
  <div id="slider" class="slider">
    <div id="sliderFill" class="slider-fill"></div>
    <div id="sliderText" class="slider-text">➜ 向右滑動解鎖引擎</div>
    <div id="sliderHandle" class="slider-handle">⚡</div>
  </div>
</div>

<div id="log" class="log">// 等待全網資料...</div>

<div id="controls" class="controls">
  <button id="manual" class="btn blue" disabled>⚡ 手動 +200</button>
  <button id="start" class="btn green" disabled>🚀 啟動極速引擎</button>
  <button id="stop" class="btn red" style="display:none">🛑 停止</button>
  <button id="afkButton" class="btn purple full" disabled>💤 掛機省電模式</button>
</div>

<div id="info" class="info">SYSTEM READY</div>

</div>
</div>
