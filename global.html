<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚡ 2x 全網二進制極速引擎 (終極完整版)</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
      background-color: #030712; color: #38bdf8;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; 
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom)) 16px;
    }
    .panel { background: #0b0f19; border: 1px solid #1e293b; border-radius: 14px; padding: 24px; width: 100%; max-width: 680px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7); }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    .title { font-size: clamp(14px, 4vw, 16px); font-weight: bold; color: #f1f5f9; text-align: left; }
    .header-right { display: flex; gap: 10px; align-items: center; }
    .online-badge { display: flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #34d399; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .online-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
    .global-number { font-size: clamp(32px, 10vw, 50px); font-weight: bold; color: #f59e0b; margin: 12px 0; text-shadow: 0 0 20px rgba(245, 158, 11, 0.4); letter-spacing: -1px; word-break: break-all; line-height: 1.1; }
    .status-text { color: #10b981; font-size: 13px; margin-bottom: 12px; min-height: 18px; }
    
    .auth-panel { background: #111827; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 16px; text-align: left; }
    .auth-title { font-size: 14px; font-weight: bold; color: #f1f5f9; margin-bottom: 12px; }
    .auth-input { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #334155; background: #020617; color: #fff; font-family: inherit; outline: none; }
    .auth-input:focus { border-color: #38bdf8; }
    .auth-btn-group { display: flex; gap: 8px; margin-top: 4px; }
    .auth-error { color: #ef4444; font-size: 12px; margin-top: 8px; min-height: 14px; text-align: center; }
    .user-info { font-size: 11px; color: #94a3b8; display: flex; justify-content: space-between; margin-bottom: 8px; }
    .btn-logout { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 11px; text-decoration: underline; padding: 0; }
    
    .verify-banner { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; border-radius: 8px; padding: 12px; margin-bottom: 16px; color: #fca5a5; font-size: 12px; text-align: center; display: none; }
    .verify-action-btn { background: none; border: none; color: #38bdf8; cursor: pointer; text-decoration: underline; font-family: inherit; font-size: 12px; font-weight: bold; padding: 0 4px; }

    .divider { display: flex; align-items: center; text-align: center; margin: 16px 0; color: #64748b; font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #334155; }
    .divider:not(:empty)::before { margin-right: .5em; }
    .divider:not(:empty)::after { margin-left: .5em; }

    .btn-google { width: 100%; background: #ffffff; color: #1f2937; padding: 10px; font-size: 13px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-google:active { background: #e5e7eb; }
    .btn-google img { width: 18px; height: 18px; }

    .log-window { background: #020617; border: 1px solid #0f172a; border-radius: 8px; height: 240px; overflow-y: auto; padding: 12px; font-size: 13px; line-height: 1.6; text-align: left; margin-bottom: 16px; }
    details { background: rgba(30, 41, 59, 0.5); border: 1px solid #334155; border-radius: 6px; margin-bottom: 6px; padding: 4px 8px; color: #94a3b8; }
    summary { cursor: pointer; font-weight: bold; color: #f59e0b; user-select: none; }
    .compressed-content { margin-top: 6px; padding-left: 10px; border-left: 2px solid #f59e0b; font-size: 12px; color: #64748b; max-height: 120px; overflow-y: auto; }
    .log-line { display: flex; justify-content: space-between; color: #94a3b8; }
    .log-line.active { color: #38bdf8; }
    .log-line.record-break { color: #f59e0b; font-weight: bold; background: rgba(245, 158, 11, 0.1); }
    .slider-captcha-container { margin-bottom: 16px; display: none; }
    .slider-track { position: relative; width: 100%; height: 48px; background: #111827; border: 1px solid #334155; border-radius: 24px; overflow: hidden; display: flex; align-items: center; justify-content: center; padding-left: 44px; padding-right: 16px; }
    .slider-track-text { color: #94a3b8; font-size: 13px; font-weight: bold; pointer-events: none; transition: opacity 0.2s; text-align: center; width: 100%; }
    .slider-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: rgba(16, 185, 129, 0.25); pointer-events: none; }
    .slider-handle { position: absolute; left: 2px; top: 2px; width: 44px; height: 44px; background: #0284c7; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 18px; font-weight: bold; cursor: grab; box-shadow: 0 2px 6px rgba(0,0,0,0.5); touch-action: none; }
    .slider-handle:active { cursor: grabbing; background: #0369a1; }
    .slider-track.verified { background: rgba(16, 185, 129, 0.15); border-color: #10b981; padding-left: 0; }
    .slider-track.verified .slider-track-text { color: #34d399; }
    .slider-track.verified .slider-handle { left: auto !important; right: 2px !important; }
    
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; display: none; }
    button.ctrl-btn { padding: 12px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.15s; font-family: inherit; }
    button.ctrl-btn:disabled { background: #1e293b !important; color: #64748b !important; cursor: not-allowed; opacity: 0.6; }
    button.ctrl-btn:active:not(:disabled) { transform: scale(0.95); }
    .btn-step { background: #2563eb; color: #fff; }
    .btn-auto { background: #059669; color: #fff; }
    .btn-afk { background: #8b5cf6; color: #fff; grid-column: span 2; }
    .btn-stop { background: #dc2626; color: #fff; }
    .debug-box { margin-top: 14px; padding: 8px; background: #020617; border: 1px solid #1e293b; border-radius: 6px; font-size: 11px; color: #64748b; text-align: left; }
    
    #afkOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.98); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; color: #10b981; cursor: pointer; }
    .afk-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; animation: pulse 2s infinite; color: #34d399; }
    .afk-number { font-size: clamp(36px, 10vw, 56px); color: #f59e0b; font-weight: bold; letter-spacing: -1px; text-shadow: 0 0 30px rgba(245, 158, 11, 0.5); word-break: break-all; text-align: center; padding: 0 20px; }
    .afk-hint { margin-top: 30px; font-size: 13px; color: #64748b; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>

  <div id="afkOverlay">
    <div class="afk-title" id="afkTitle">💤 鐵壁掛機模式運行中...</div>
    <div class="afk-number" id="afkGlobal">...</div>
    <div class="afk-hint">（點擊畫面任意處瞬間喚醒停止）</div>
  </div>

  <div class="panel">
    <div class="header-bar">
      <div class="title">⚡ 2x 極速引擎</div>
      <div class="header-right">
        <div class="online-badge"><div class="online-dot"></div><span id="onlineCount">檢查中...</span></div>
      </div>
    </div>
    
    <div class="user-info" id="userInfo" style="display: none;">
      <span id="userEmailTxt"></span>
      <button class="btn-logout" id="btnLogout">登出帳號</button>
    </div>

    <div class="global-number" id="displayGlobal">...</div>
    <div class="status-text" id="statusTxt">請先登入帳號</div>

    <div class="verify-banner" id="verifyBanner">
      ⚠️ 帳號尚未驗證信箱！請檢查收件匣點擊驗證連結。<br><br>
      <button class="verify-action-btn" id="btnResendEmail">重新發送驗證信</button> | 
      <button class="verify-action-btn" id="btnReloadVerify" style="color: #34d399;">我已完成驗證</button>
    </div>

    <div class="auth-panel" id="authPanel">
      <div class="auth-title">🔐 節點權限驗證</div>
      <input type="email" id="emailInput" class="auth-input" placeholder="請輸入 E-mail">
      <input type="password" id="passwordInput" class="auth-input" placeholder="請輸入密碼 (至少 6 碼)">
      <div class="auth-btn-group">
        <button id="btnLogin" class="ctrl-btn btn-step" style="flex: 1; padding: 8px;">登入</button>
        <button id="btnSignup" class="ctrl-btn btn-auto" style="flex: 1; padding: 8px;">註冊新帳號</button>
      </div>
      
      <div class="divider">或</div>
      
      <button id="btnGoogle" class="btn-google">
        <img src="https://www.google.com/favicon.ico" alt="Google"> 使用 Google 帳號一鍵登入
      </button>

      <div id="authError" class="auth-error"></div>
    </div>

    <div class="slider-captcha-container" id="captchaContainer">
      <div class="slider-track" id="sliderTrack">
        <div class="slider-fill" id="sliderFill"></div>
        <div class="slider-track-text" id="sliderText">➔ 向右滑動解鎖引擎</div>
        <div class="slider-handle" id="sliderHandle">⚡</div>
      </div>
    </div>

    <div class="log-window" id="logWindow">
      <div id="archiveArea"></div>
      <div id="liveArea"><div style="color: #64748b;" id="placeholder">// 安全連線建立後將即時同步全網算式...</div></div>
    </div>

    <div class="controls" id="engineControls">
      <button class="ctrl-btn btn-step" id="btnStep" disabled>手動貢獻 +200</button>
      <button class="ctrl-btn btn-auto" id="btnAuto" disabled>🚀 啟動極速狂飆</button>
      <button class="ctrl-btn btn-stop" id="btnStop" style="display: none;">🛑 停止狂飆</button>
      <button class="ctrl-btn btn-afk" id="btnAfk" disabled>💤 掛機省電模式</button>
    </div>

    <div class="debug-box" id="debugLog">系統日誌：初始化中...</div>
  </div>

  <script>
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('keydown', event => {
      if (event.keyCode === 123 || (event.ctrlKey && event.shiftKey && event.keyCode === 73) || (event.metaKey && event.altKey && event.keyCode === 73)) {
        event.preventDefault();
      }
    });

    (function() {
      function logMsg(msg) {
        const dbg = document.getElementById('debugLog');
        if (dbg) dbg.innerHTML = `系統日誌：${msg}`;
      }

      // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries
= {
  apiKey: "AIzaSyCxDuuIwrtR8JGvgbEIMnjQm8zwZvhyL7s",
  authDomain: "binary-limit-breaker.firebaseapp.com",
  databaseURL: "https://binary-limit-breaker-default-rtdb.firebaseio.com",
  projectId: "binary-limit-breaker",
  storageBucket: "binary-limit-breaker.firebasestorage.app",
  messagingSenderId: "278424467808",
  appId: "1:278424467808:web:fceb3ddc3817f5d4230605"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);

      try { if (!firebase.apps.length) firebase.initializeApp(firebaseConfig); } 
      catch (e) { logMsg("❌ 初始化失敗: " + e.message); }

      const db = firebase.database();
      const auth = firebase.auth();
      const googleProvider = new firebase.auth.GoogleAuthProvider();
      const counterRef = db.ref('global_2x_steps');
      const onlineUsersRef = db.ref('online_users');

      const authPanel = document.getElementById('authPanel');
      const emailInput = document.getElementById('emailInput');
      const passwordInput = document.getElementById('passwordInput');
      const authError = document.getElementById('authError');
      const userInfo = document.getElementById('userInfo');
      const userEmailTxt = document.getElementById('userEmailTxt');
      const verifyBanner = document.getElementById('verifyBanner');
      const captchaContainer = document.getElementById('captchaContainer');
      const engineControls = document.getElementById('engineControls');
      const statusTxt = document.getElementById('statusTxt');

      document.getElementById('btnLogin').addEventListener('click', () => {
        authError.textContent = '登入中...';
        auth.signInWithEmailAndPassword(emailInput.value, passwordInput.value)
          .catch(error => authError.textContent = "登入失敗: " + error.message);
      });

      document.getElementById('btnSignup').addEventListener('click', () => {
        authError.textContent = '註冊中...';
        auth.createUserWithEmailAndPassword(emailInput.value, passwordInput.value)
          .then((cred) => {
            cred.user.sendEmailVerification();
            alert("註冊成功！驗證信已寄至您的信箱，請點擊信中連結完成啟用。");
          })
          .catch(error => authError.textContent = "註冊失敗: " + error.message);
      });

      document.getElementById('btnGoogle').addEventListener('click', () => {
        authError.textContent = 'Google 授權中...';
        auth.signInWithPopup(googleProvider)
          .catch(error => authError.textContent = "Google 登入失敗: " + error.message);
      });

      document.getElementById('btnLogout').addEventListener('click', () => {
        stopEngine();
        auth.signOut();
      });

      document.getElementById('btnResendEmail').addEventListener('click', () => {
        if (auth.currentUser) {
          auth.currentUser.sendEmailVerification()
            .then(() => alert("驗證信已重新發送！請至收件匣確認。"))
            .catch(err => alert("發送失敗：" + err.message));
        }
      });

      document.getElementById('btnReloadVerify').addEventListener('click', () => {
        if (auth.currentUser) {
          auth.currentUser.reload().then(() => {
            if (auth.currentUser.emailVerified) {
              location.reload();
            } else {
              alert("尚未完成驗證！請確認您已在信箱中點擊確認連結。");
            }
          });
        }
      });

      auth.onAuthStateChanged((user) => {
        if (user) {
          userInfo.style.display = 'flex';
          authPanel.style.display = 'none';

          if (!user.emailVerified) {
            logMsg("⚠️ 帳號尚未驗證信箱：" + user.email);
            userEmailTxt.textContent = "👤 " + user.email + " (未驗證)";
            verifyBanner.style.display = 'block';
            captchaContainer.style.display = 'none';
            engineControls.style.display = 'none';
            statusTxt.textContent = '⚠️ 請先完成信箱驗證以解鎖算力引擎';
            return;
          }

          logMsg("🔓 驗證通過：" + user.email);
          userEmailTxt.textContent = "👤 " + user.email;
          verifyBanner.style.display = 'none';
          captchaContainer.style.display = 'block';
          engineControls.style.display = 'grid';
          statusTxt.textContent = '✅ 帳號驗證通過，請解鎖引擎';
        } else {
          logMsg("🔒 等待使用者登入");
          authPanel.style.display = 'block';
          userInfo.style.display = 'none';
          verifyBanner.style.display = 'none';
          captchaContainer.style.display = 'none';
          engineControls.style.display = 'none';
          statusTxt.textContent = '請先登入帳號';
          
          isVerified = false;
          btnStep.disabled = true; btnAuto.disabled = true; btnAfk.disabled = true;
          handle.style.left = '2px'; fill.style.width = '0px';
          track.classList.remove('verified'); handle.innerHTML = '⚡'; handle.style.background = '#0284c7';
          sliderText.textContent = '➔ 向右滑動解鎖引擎';
        }
      });

      const displayGlobal = document.getElementById('displayGlobal');
      const afkGlobal = document.getElementById('afkGlobal');
      const onlineCount = document.getElementById('onlineCount');
      const logWindow = document.getElementById('logWindow');
      const liveArea = document.getElementById('liveArea');
      const archiveArea = document.getElementById('archiveArea');
      const btnStep = document.getElementById('btnStep');
      const btnAuto = document.getElementById('btnAuto');
      const btnStop = document.getElementById('btnStop');
      const btnAfk = document.getElementById('btnAfk');
      const afkOverlay = document.getElementById('afkOverlay');

      let currentKnownSteps = 0, localPendingSteps = 0, isRunning = false, hasPlayedAudio = false;
      let pendingArchive = [], wakeLock = null;
      const MAX_LIVE_ROWS = 25, COMPACT_BLOCK_SIZE = 200, MAX_SAFE_UPLOAD = 140000; 

      const workerBlobCode = `
        let timer = null; let lastTick = 0;
        self.onmessage = function(e) {
          if (e.data === 'start') {
            if (timer) return;
            lastTick = Date.now();
            timer = setInterval(() => {
              const now = Date.now(); const elapsed = now - lastTick;
              const ticks = Math.max(1, Math.floor(elapsed / 4));
              lastTick = now - (elapsed % 4);
              self.postMessage({ type: 'tick', count: 500 * ticks });
            }, 4);
          } else if (e.data === 'stop') {
            if (timer) { clearInterval(timer); timer = null; }
          }
        };
      `;
      const computeWorker = new Worker(URL.createObjectURL(new Blob([workerBlobCode], { type: 'application/javascript' })));

      computeWorker.onmessage = function(e) {
        if (e.data.type === 'tick' && isRunning) { localPendingSteps += e.data.count; }
      };

      async function enableWakeLock() {
        try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } 
        catch (err) {}
      }
      function disableWakeLock() {
        if (wakeLock !== null) { wakeLock.release().then(() => { wakeLock = null; }); }
      }

      const track = document.getElementById('sliderTrack'), handle = document.getElementById('sliderHandle');
      const fill = document.getElementById('sliderFill'), sliderText = document.getElementById('sliderText');
      let isDragging = false, isVerified = false, startX = 0;

      function handleStart(e) {
        if (isVerified) return; isDragging = true;
        startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      }
      function handleMove(e) {
        if (!isDragging || isVerified) return;
        if (e.cancelable) e.preventDefault(); 
        const currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        const maxDistance = track.clientWidth - handle.clientWidth - 4;
        let moveDistance = Math.min(Math.max(0, currentX - startX), maxDistance);

        handle.style.left = `${moveDistance + 2}px`; fill.style.width = `${moveDistance + handle.clientWidth / 2}px`;
        if (moveDistance >= maxDistance - 4) {
          isVerified = true; isDragging = false;
          handle.style.left = ''; fill.style.width = '100%';
          track.classList.add('verified'); handle.innerHTML = '✔'; handle.style.background = '#10b981';
          sliderText.textContent = '🛡️ 驗證通過，引擎已解鎖';
          btnStep.disabled = false; btnAuto.disabled = false; btnAfk.disabled = false;
          if (typeof confetti === 'function') confetti({ particleCount: 60, spread: 60, origin: { y: 0.7 } });
        }
      }
      function handleEnd() {
        if (!isDragging || isVerified) return; isDragging = false;
        handle.style.transition = 'left 0.25s ease'; fill.style.transition = 'width 0.25s ease';
        handle.style.left = '2px'; fill.style.width = '0px';
        setTimeout(() => { handle.style.transition = ''; fill.style.transition = ''; }, 250);
      }

      handle.addEventListener('mousedown', handleStart); window.addEventListener('mousemove', handleMove); window.addEventListener('mouseup', handleEnd);
      handle.addEventListener('touchstart', handleStart, { passive: true }); window.addEventListener('touchmove', handleMove, { passive: false }); window.addEventListener('touchend', handleEnd);

      const myPresenceRef = onlineUsersRef.push();
      db.ref(".info/connected").on("value", (snap) => {
        if (snap.val() === true) {
          myPresenceRef.onDisconnect().remove(); myPresenceRef.set(true);
        }
      });
      onlineUsersRef.on("value", (snap) => {
        onlineCount.textContent = `在線節點: ${snap.numChildren() || 1}`;
      });

      function formatLineText(s) { return `[第 ${s.toLocaleString()} 步] 2 × ${s.toLocaleString()} = ${(s*2).toLocaleString()}`; }
      function createLogElement(s) {
        const res = s * 2, row = document.createElement('div'); row.className = 'log-line active';
        if (res >= 1000000) {
          row.className += ' record-break';
          row.innerHTML = `<span>${formatLineText(s)}</span> <span>👑 突破極限！</span>`;
          if (!hasPlayedAudio) { if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 90 }); hasPlayedAudio = true; }
        } else { row.innerHTML = `<span>${formatLineText(s)}</span>`; }
        return row;
      }

      function compressLogs() {
        while (liveArea.children.length > MAX_LIVE_ROWS) {
          const oldestNode = liveArea.firstElementChild;
          if (oldestNode.dataset && oldestNode.dataset.step) pendingArchive.push(Number(oldestNode.dataset.step));
          liveArea.removeChild(oldestNode);
          if (pendingArchive.length >= COMPACT_BLOCK_SIZE) {
            const details = document.createElement('details'), summary = document.createElement('summary'), content = document.createElement('div');
            content.className = 'compressed-content';
            summary.textContent = `📁 已壓縮紀錄：第 ${pendingArchive[0].toLocaleString()} 步 ~ ${pendingArchive[pendingArchive.length - 1].toLocaleString()} 步`;
            content.innerHTML = pendingArchive.map(s => formatLineText(s)).join('<br>');
            details.appendChild(summary); details.appendChild(content); archiveArea.appendChild(details);
            pendingArchive = [];
          }
        }
      }

      function appendStepsToLog(fromStep, toStep) {
        const ph = document.getElementById('placeholder'); if (ph) ph.remove();
        if (toStep - fromStep > 30) {
          const details = document.createElement('details'), summary = document.createElement('summary'), content = document.createElement('div');
          content.className = 'compressed-content';
          summary.textContent = `⚡ 全網極速狂飆：第 ${fromStep.toLocaleString()} 步 ~ ${toStep.toLocaleString()} 步`;
          content.innerHTML = `${formatLineText(fromStep)}<br>... 期間全網連線高速完成 ...<br>${formatLineText(toStep)}`;
          details.appendChild(summary); details.appendChild(content); archiveArea.appendChild(details);
          for (let s = Math.max(fromStep, toStep - 10); s <= toStep; s++) {
            const row = createLogElement(s); row.dataset.step = s; liveArea.appendChild(row);
          }
        } else {
          for (let s = fromStep; s <= toStep; s++) {
            const row = createLogElement(s); row.dataset.step = s; liveArea.appendChild(row);
          }
        }
        compressLogs(); logWindow.scrollTop = logWindow.scrollHeight;
      }

      counterRef.on('value', (snapshot) => {
        const globalSteps = snapshot.val() || 0;
        const formattedNum = (globalSteps * 2).toLocaleString();
        displayGlobal.textContent = formattedNum; afkGlobal.textContent = formattedNum;
        if (globalSteps > currentKnownSteps) {
          appendStepsToLog(currentKnownSteps === 0 ? Math.max(1, globalSteps - 5) : currentKnownSteps + 1, globalSteps);
          currentKnownSteps = globalSteps;
        }
      });

      function syncToCloud() {
        if (localPendingSteps > 0 && auth.currentUser && auth.currentUser.emailVerified) {
          let stepsToUpload = Math.min(localPendingSteps, MAX_SAFE_UPLOAD);
          localPendingSteps -= stepsToUpload; 
          statusTxt.textContent = `⚡ 正在安全上傳 ${stepsToUpload.toLocaleString()} 步算式...`;
          counterRef.transaction((curr) => (curr || 0) + stepsToUpload, (error, committed) => {
            if (committed) { statusTxt.textContent = `🔥 成功為全網貢獻了 ${(stepsToUpload * 2).toLocaleString()}！`; } 
            else { logMsg("❌ 上傳被拒絕"); localPendingSteps += stepsToUpload; }
          });
        }
      }
      setInterval(syncToCloud, 500);

      function startEngine() {
        if (!isVerified || !auth.currentUser || !auth.currentUser.emailVerified) return;
        if (isRunning) return; isRunning = true;
        computeWorker.postMessage('start');
        btnStep.style.display = 'none'; btnAuto.style.display = 'none'; 
        btnStop.style.display = ''; btnAfk.style.gridColumn = 'span 1';
      }

      function stopEngine() {
        isRunning = false; computeWorker.postMessage('stop');
        localPendingSteps = 0; 
        btnStep.style.display = ''; btnAuto.style.display = ''; 
        btnStop.style.display = 'none'; btnAfk.style.gridColumn = 'span 2';
        statusTxt.textContent = '🛑 引擎已停止'; disableWakeLock();
      }

      btnStep.addEventListener('click', (e) => { e.stopPropagation(); if (isVerified) localPendingSteps += 100; });
      btnAuto.addEventListener('click', (e) => { e.stopPropagation(); startEngine(); });
      btnStop.addEventListener('click', (e) => { e.stopPropagation(); stopEngine(); });
      btnAfk.addEventListener('click', (e) => {
        e.stopPropagation(); if (!isVerified) return;
        startEngine(); enableWakeLock(); afkOverlay.style.display = 'flex';
      });
      afkOverlay.addEventListener('click', () => { afkOverlay.style.display = 'none'; stopEngine(); });
    })();
  </script>
</body>
</html>
