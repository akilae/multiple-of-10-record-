<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2x Binary Engine - 全網極速運算核心</title>
  
  <!-- 載入 Firebase SDKs (v8 相容版) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app-check.js"></script>

  <style>
    :root {
      --bg: #0b0f19; --card-bg: #151d30; --accent: #00f2fe; --accent-glow: rgba(0, 242, 254, 0.4);
      --text: #f0f4f8; --text-dim: #8a99ad; --danger: #ff4d4f; --success: #00e676;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .container { width: 100%; max-width: 520px; background: var(--card-bg); border-radius: 16px; padding: 28px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.08); text-align: center; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--accent); letter-spacing: 1px; }
    .subtitle { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 24px; }
    .status-bar { display: flex; justify-content: space-between; font-size: 0.85rem; background: rgba(0,0,0,0.3); padding: 8px 16px; border-radius: 8px; margin-bottom: 20px; color: var(--text-dim); }
    .status-online { color: var(--success); font-weight: bold; }
    .counter-card { background: rgba(0, 242, 254, 0.05); border: 1px solid var(--accent-glow); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
    .counter-label { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px; }
    .counter-val { font-size: 2.2rem; font-weight: 800; font-family: monospace; color: #fff; word-break: break-all; }
    .personal-val { font-size: 1rem; color: var(--accent); margin-top: 6px; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; margin-bottom: 12px; }
    .btn-primary { background: linear-gradient(135deg, #00c6ff, #0072ff); color: white; box-shadow: 0 4px 15px var(--accent-glow); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); }
    .btn-secondary:hover { background: rgba(255,255,255,0.12); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* 忘記密碼按鈕專用樣式 */
    .btn-text { background: transparent; color: var(--text-dim); border: 1px solid transparent; font-size: 0.9rem; margin-bottom: 0; padding: 10px; }
    .btn-text:hover { color: #fff; text-decoration: underline; }

    .auth-box input { width: 100%; padding: 12px 14px; margin-bottom: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.2); color: #fff; font-size: 0.95rem; }
    .auth-box input:focus { outline: none; border-color: var(--accent); }
    .msg { font-size: 0.85rem; margin-top: 10px; min-height: 20px; }
    .msg.error { color: var(--danger); }
    .msg.success { color: var(--success); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <h1>⚡ 2x BINARY ENGINE</h1>
    <div class="subtitle">分散式節點算力倍增核心</div>

    <div class="status-bar">
      <span>連線狀態: <span id="netStatus" class="status-online">連線中...</span></span>
      <span>全網在線節點: <span id="onlineCount">0</span></span>
    </div>

    <div class="counter-card">
      <div class="counter-label">全網累積算力指數 (2^N)</div>
      <div class="counter-val" id="globalSteps">0</div>
      <div class="personal-val">我的貢獻: <span id="localContrib">0</span> 次</div>
    </div>

    <div id="verifyAlert" class="msg error hidden" style="margin-bottom: 15px;">
      ⚠️ 請先前往收件匣完成 Email 驗證才能啟動加速引擎！
      <button class="btn btn-secondary" style="margin-top: 8px; padding: 6px;" onclick="resendVerifyEmail()">重寄驗證信</button>
      <button class="btn btn-text" onclick="handleLogout()">登出並換帳號</button>
    </div>

    <div id="engineControls" class="hidden">
      <button class="btn btn-primary" id="boostBtn" onclick="triggerBoost()">🚀 注入算力 (2x Boost)</button>
      <button class="btn btn-secondary" onclick="handleLogout()">登出節點</button>
    </div>

    <div id="authBox" class="auth-box">
      <input type="email" id="authEmail" placeholder="電子郵件 (Email)" autocomplete="email">
      <input type="password" id="authPassword" placeholder="密碼 (至少 6 位數)" autocomplete="current-password">
      <button class="btn btn-primary" onclick="handleAuth('login')">節點登入</button>
      <button class="btn btn-secondary" onclick="handleAuth('register')">註冊新節點</button>
      <button class="btn btn-text" onclick="handleResetPassword()">忘記密碼？</button>
      
      <div id="authMsg" class="msg"></div>
    </div>
  </div>

  <script>
    // 1. Firebase 基礎設定與金鑰
    const firebaseConfig = {
      apiKey: "AIzaSyCxDuuIwrtR8JGvgbEIMnjQm8zwZvhyL7s",
      authDomain: "binary-limit-breaker.firebaseapp.com",
      databaseURL: "https://binary-limit-breaker-default-rtdb.firebaseio.com",
      projectId: "binary-limit-breaker",
      storageBucket: "binary-limit-breaker.firebasestorage.app",
      messagingSenderId: "278424467808",
      appId: "1:278424467808:web:fceb3ddc3817f5d4230605"
    };

    firebase.initializeApp(firebaseConfig);

    // 2. 啟用 App Check (正確的 Firebase v8 寫法)
    const appCheck = firebase.appCheck();
    appCheck.activate('6Lflc7ctAAAAAF5LsBE301y0oxqiXAhuk1Jx4XkG', true);

    const auth = firebase.auth();
    const db = firebase.database();

    // =========================================================
    // 若後續測試正常且需要混淆，請將以下所有程式碼複製到 obfuscator.io 處理
    // =========================================================
    let currentUser = null;
    let localPendingBoosts = 0;
    let totalLocalContrib = 0;
    const globalStepsEl = document.getElementById('globalSteps');
    const onlineCountEl = document.getElementById('onlineCount');
    const localContribEl = document.getElementById('localContrib');
    const netStatusEl = document.getElementById('netStatus');
    const authBox = document.getElementById('authBox');
    const engineControls = document.getElementById('engineControls');
    const verifyAlert = document.getElementById('verifyAlert');
    const authMsg = document.getElementById('authMsg');

    db.ref('.info/connected').on('value', (snap) => {
      if (snap.val() === true) {
        netStatusEl.innerText = "已連線";
        netStatusEl.className = "status-online";
        if (currentUser) setupPresence(currentUser.uid);
      } else {
        netStatusEl.innerText = "離線中";
        netStatusEl.style.color = "var(--danger)";
      }
    });

    db.ref('global_metrics/steps').on('value', (snap) => {
      const val = snap.val() || 0;
      globalStepsEl.innerText = Number(val).toLocaleString();
    });

    db.ref('online_nodes').on('value', (snap) => {
      onlineCountEl.innerText = snap.numChildren() || 1;
    });

    auth.onAuthStateChanged((user) => {
      currentUser = user;
      authMsg.innerText = "";
      if (user) {
        authBox.classList.add('hidden');
        if (user.emailVerified) {
          verifyAlert.classList.add('hidden');
          engineControls.classList.remove('hidden');
          setupPresence(user.uid);
        } else {
          verifyAlert.classList.remove('hidden');
          engineControls.classList.add('hidden');
        }
      } else {
        authBox.classList.remove('hidden');
        engineControls.classList.add('hidden');
        verifyAlert.classList.add('hidden');
      }
    });

    async function handleAuth(type) {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      authMsg.className = "msg";
      authMsg.innerText = "連線驗證中...";
      try {
        if (type === 'register') {
          const cred = await auth.createUserWithEmailAndPassword(email, password);
          await cred.user.sendEmailVerification();
          authMsg.className = "msg success";
          authMsg.innerText = "註冊成功！驗證信已寄出，請驗證後重新整理頁面。";
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (err) {
        authMsg.className = "msg error";
        authMsg.innerText = getErrorMessage(err.code);
      }
    }

    async function handleResetPassword() {
      const email = document.getElementById('authEmail').value.trim();
      authMsg.className = "msg";
      if (!email) {
        authMsg.className = "msg error";
        authMsg.innerText = "⚠️ 請先在上方的欄位輸入您的 Email，再點擊忘記密碼。";
        return;
      }
      authMsg.innerText = "正在發送密碼重置信...";
      try {
        await auth.sendPasswordResetEmail(email);
        authMsg.className = "msg success";
        authMsg.innerText = "✅ 密碼重置信已寄出！請至信箱查收並重設密碼。";
      } catch (err) {
        authMsg.className = "msg error";
        authMsg.innerText = getErrorMessage(err.code);
      }
    }

    async function resendVerifyEmail() {
      if (auth.currentUser) {
        await auth.currentUser.sendEmailVerification();
        alert("驗證信已重新發送，請至信箱查收！");
      }
    }

    function handleLogout() {
      if (currentUser) {
        db.ref(`online_nodes/${currentUser.uid}`).remove();
      }
      auth.signOut();
    }

    function setupPresence(uid) {
      const myNodeRef = db.ref(`online_nodes/${uid}`);
      myNodeRef.onDisconnect().remove();
      myNodeRef.set({ onlineAt: firebase.database.ServerValue.TIMESTAMP });
    }

    function triggerBoost() {
      if (!currentUser || !currentUser.emailVerified) return;
      localPendingBoosts += 1;
      totalLocalContrib += 1;
      localContribEl.innerText = totalLocalContrib;
      const currentVal = parseInt(globalStepsEl.innerText.replace(/,/g, '')) || 0;
      globalStepsEl.innerText = (currentVal + 1).toLocaleString();
    }

    setInterval(() => {
      if (localPendingBoosts > 0 && currentUser) {
        const toAdd = localPendingBoosts;
        localPendingBoosts = 0;
        db.ref('global_metrics/steps').transaction((current) => {
          return (current || 0) + toAdd;
        }, (error) => {
          if (error) {
            console.error("算力同步失敗:", error);
            localPendingBoosts += toAdd;
          }
        });
      }
    }, 1500);

    function getErrorMessage(code) {
      switch (code) {
        case 'auth/invalid-email': return 'Email 格式不正確';
        case 'auth/user-not-found': return '找不到此帳號，請確認信箱是否正確';
        case 'auth/wrong-password': return '密碼錯誤';
        case 'auth/email-already-in-use': return '此信箱已註冊過';
        case 'auth/weak-password': return '密碼長度需至少 6 位';
        case 'auth/missing-email': return '請輸入 Email';
        default: return '驗證失敗，請檢查輸入資訊';
      }
    }
  </script>
</body>
</html>
