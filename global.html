  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
      background-color: #030712; color: #38bdf8;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; 
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom)) 16px;
    }
    .panel { background: #0b0f19; border: 1px solid #1e293b; border-radius: 14px; padding: 24px; width: 100%; max-width: 680px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7); }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    .title { font-size: clamp(14px, 4vw, 16px); font-weight: bold; color: #f1f5f9; text-align: left; }
    .header-right { display: flex; gap: 10px; align-items: center; }
    .online-badge { display: flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #34d399; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .lang-btn { background: #1e293b; color: #f1f5f9; border: 1px solid #334155; padding: 4px 10px; border-radius: 14px; cursor: pointer; font-size: 12px; font-family: inherit; font-weight: bold; transition: 0.2s; }
    .lang-btn:active { background: #334155; }
    .online-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
    .global-number { font-size: clamp(32px, 10vw, 50px); font-weight: bold; color: #f59e0b; margin: 12px 0; text-shadow: 0 0 20px rgba(245, 158, 11, 0.4); letter-spacing: -1px; word-break: break-all; line-height: 1.1; }
    .status-text { color: #10b981; font-size: 13px; margin-bottom: 12px; min-height: 18px; }
    .log-window { background: #020617; border: 1px solid #0f172a; border-radius: 8px; height: 240px; overflow-y: auto; padding: 12px; font-size: 13px; line-height: 1.6; text-align: left; margin-bottom: 16px; }
    details { background: rgba(30, 41, 59, 0.5); border: 1px solid #334155; border-radius: 6px; margin-bottom: 6px; padding: 4px 8px; color: #94a3b8; }
    summary { cursor: pointer; font-weight: bold; color: #f59e0b; user-select: none; }
    .compressed-content { margin-top: 6px; padding-left: 10px; border-left: 2px solid #f59e0b; font-size: 12px; color: #64748b; max-height: 120px; overflow-y: auto; }
    .log-line { display: flex; justify-content: space-between; color: #94a3b8; }
    .log-line.active { color: #38bdf8; }
    .log-line.record-break { color: #f59e0b; font-weight: bold; background: rgba(245, 158, 11, 0.1); }
    .slider-captcha-container { margin-bottom: 16px; }
    .slider-track { position: relative; width: 100%; height: 48px; background: #111827; border: 1px solid #334155; border-radius: 24px; overflow: hidden; display: flex; align-items: center; justify-content: center; padding-left: 44px; padding-right: 16px; }
    .slider-track-text { color: #94a3b8; font-size: 13px; font-weight: bold; pointer-events: none; transition: opacity 0.2s; text-align: center; width: 100%; }
    .slider-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: rgba(16, 185, 129, 0.25); pointer-events: none; }
    .slider-handle { position: absolute; left: 2px; top: 2px; width: 44px; height: 44px; background: #0284c7; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 18px; font-weight: bold; cursor: grab; box-shadow: 0 2px 6px rgba(0,0,0,0.5); touch-action: none; }
    .slider-handle:active { cursor: grabbing; background: #0369a1; }
    .slider-track.verified { background: rgba(16, 185, 129, 0.15); border-color: #10b981; padding-left: 0; }
    .slider-track.verified .slider-track-text { color: #34d399; }
    .slider-track.verified .slider-handle { left: auto !important; right: 2px !important; }
    
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button.ctrl-btn { padding: 12px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.15s; font-family: inherit; }
    button.ctrl-btn:disabled { background: #1e293b !important; color: #64748b !important; cursor: not-allowed; opacity: 0.6; }
    button.ctrl-btn:active:not(:disabled) { transform: scale(0.95); }
    .btn-step { background: #2563eb; color: #fff; }
    .btn-auto { background: #059669; color: #fff; }
    .btn-afk { background: #8b5cf6; color: #fff; grid-column: span 2; }
    .btn-stop { background: #dc2626; color: #fff; }
    .debug-box { margin-top: 14px; padding: 8px; background: #020617; border: 1px solid #1e293b; border-radius: 6px; font-size: 11px; color: #64748b; text-align: left; }
    
    #afkOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.98); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; color: #10b981; cursor: pointer; }
    .afk-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; animation: pulse 2s infinite; color: #34d399; }
    .afk-number { font-size: clamp(36px, 10vw, 56px); color: #f59e0b; font-weight: bold; letter-spacing: -1px; text-shadow: 0 0 30px rgba(245, 158, 11, 0.5); word-break: break-all; text-align: center; padding: 0 20px; }
    .afk-hint { margin-top: 30px; font-size: 13px; color: #64748b; }
